<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0">
	<title>UCC Admin | Archive</title>
	<link rel="icon" type="image/png" href="images/ucc-LOGO.png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet">
	<script src="https://unpkg.com/lucide@latest"></script>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="dashboard-layout">
		<aside class="sidebar">
			<div class="sidebar-top">
				<div class="logo-wrap">
					<img src="images/ucc-LOGO.png" alt="UCC Logo">
					<div>
						<h2>UCC Admin</h2>
						<p>University of Caloocan City</p>
					</div>
				</div>
			</div>

			<div class="gold-line"></div>

        <nav class="sidebar-nav">
            <a href="Dashboard.html">
                <i data-lucide="house"></i>
                <span>Dashboard</span>
            </a>

            <a href="Posts.html">
                <i data-lucide="newspaper"></i>
                <span>Posts</span>
            </a>

            <div class="menu-group">
                <button class="menu-title" type="button">
                    <div>
                        <i data-lucide="graduation-cap"></i>
                        <span>Academics</span>
                    </div>
                    <i data-lucide="chevron-down" class="arrow"></i>
                </button>
                <div class="submenu">
                    <a href="Academics.html">Colleges</a>
                    <a  href="Masteral.html">Masteral</a>
                </div>
            </div>

            <div class="menu-group">
                <button class="menu-title" type="button">
                    <div>
                        <i data-lucide="users"></i>
                        <span>Officials</span>
                    </div>
                    <i data-lucide="chevron-down" class="arrow"></i>
                </button>
                <div class="submenu">
                    <a href="Executive-Officials.html">Executive Officials</a>
                    <a href="Board-of-Regents.html">Board of Regents</a>
                </div>
            </div>

            <div class="menu-group open">
                <button class="menu-title active" type="button">
                    <div>
                        <i data-lucide="building-2"></i>
                        <span>Components</span>
                    </div>
                    <i data-lucide="chevron-down" class="arrow"></i>
                </button>
                <div class="submenu">
                    <a href="Campuses.html" >Campuses</a>
                    <a href="Contact-Information.html">Contact Information</a>
                    <a href="About-UCC.html">About UCC</a>
                    <a href="E-Services.html">E-Services</a>
                    <a href="Archive.html" class="active">Archive</a>
                    <a href="Quick-Links.html">Quick Links</a>
                </div>
            </div>
        </nav>

        <div class="sidebar-bottom">
            <a href="Password.html">
                <i data-lucide="lock"></i>
                <span>Password</span>
            </a>

            <a href="Logout.html">
                <i data-lucide="log-out"></i>
                <span>Logout</span>
            </a>
        </div>

			<div class="sidebar-art"></div>
		</aside>

		<main class="main-content">
            <header class="top-header">
                <div class="header-left">
                    <h1>Archive</h1>
                </div>

            <div class="header-right">
                <div class="admin-profile">
                    <div class="admin-text">
                        <small>Administrator</small>
                        <span>Welcome, Admin!</span>
                    </div>
                    <div class="avatar">
                        <i data-lucide="circle-user-round"></i>
                    </div>
                </div>
            </div>

                <div class="header-art"></div>

                <div class="gold-divider">
                    <span></span>
                </div>
</header>

</main>
</div>



<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
<script>
	lucide.createIcons();

	document.querySelectorAll(".menu-title").forEach(button=>{
		button.addEventListener("click",()=>{
			button.parentElement.classList.toggle("open");
		});
	});
</script>
</body>
</html>
